<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar producto - BookNook</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <div class="admin-layout">

        <aside class="admin-sidebar">

            <div class="admin-logo">
                BookNook
                <span>Administración</span>
            </div>

            <nav class="admin-menu">

                <a href="index.html">
                    Inicio
                </a>

                <a href="productos.html" class="activo">
                    Productos
                </a>

                <a href="usuarios.html">
                    Usuarios
                </a>

                <a href="#">
                    Órdenes
                </a>

                <a href="../index.html">
                    Ver tienda
                </a>

            </nav>

            <div class="admin-salir">
                <a href="../pages/login.html">
                    Cerrar sesión
                </a>
            </div>

        </aside>


        <main class="admin-contenido">

            <div class="admin-header">

                <p class="subtitulo">ADMINISTRACIÓN</p>

                <h1>Editar producto</h1>

                <p>
                    Modifica la información del producto seleccionado.
                </p>

            </div>


            <section class="formulario-admin">

                <form id="formEditarProducto" novalidate>

                    <div class="formulario-grid">

                        <div class="campo">

                            <label for="editarCodigo">
                                Código del producto *
                            </label>

                            <input
                                type="text"
                                id="editarCodigo"
                                value="BK001"
                                maxlength="100"
                                required
                            >

                        </div>


                        <div class="campo">

                            <label for="editarNombre">
                                Nombre *
                            </label>

                            <input
                                type="text"
                                id="editarNombre"
                                value="El Hobbit"
                                maxlength="100"
                                required
                            >

                        </div>


                        <div class="campo">

                            <label for="editarPrecio">
                                Precio *
                            </label>

                            <input
                                type="number"
                                id="editarPrecio"
                                value="12990"
                                min="0"
                                step="0.01"
                                required
                            >

                        </div>


                        <div class="campo">

                            <label for="editarStock">
                                Stock *
                            </label>

                            <input
                                type="number"
                                id="editarStock"
                                value="15"
                                min="0"
                                step="1"
                                required
                            >

                        </div>


                        <div class="campo">

                            <label for="editarStockCritico">
                                Stock crítico
                            </label>

                            <input
                                type="number"
                                id="editarStockCritico"
                                value="5"
                                min="0"
                                step="1"
                            >

                        </div>


                        <div class="campo">

                            <label for="editarCategoria">
                                Categoría *
                            </label>

                            <select id="editarCategoria" required>

                                <option value="mangas">
                                    Mangas & Cómics
                                </option>

                                <option
                                    value="fantasia"
                                    selected>
                                    Fantástica & Sci-Fi
                                </option>

                                <option value="novelas">
                                    Novelas
                                </option>

                                <option value="merch">
                                    Marcadores & Merch
                                </option>

                            </select>

                        </div>

                    </div>


                    <div class="campo">

                        <label for="editarDescripcion">
                            Descripción
                        </label>

                        <textarea
                            id="editarDescripcion"
                            maxlength="500"
                            rows="5">Una aventura clásica de fantasía para los amantes de la literatura fantástica.</textarea>

                    </div>


                    <div class="campo">

                        <label for="editarImagen">
                            Cambiar imagen
                        </label>

                        <input
                            type="file"
                            id="editarImagen"
                            accept="image/*"
                        >

                    </div>


                    <div class="formulario-botones">

                        <a
                            href="productos.html"
                            class="btn-secundario">
                            Cancelar
                        </a>

                        <button
                            type="submit"
                            class="btn-principal">
                            Guardar cambios
                        </button>

                    </div>


                    <p
                        id="mensajeEditarProducto"
                        class="mensaje-formulario">
                    </p>

                </form>

            </section>

        </main>

    </div>

</body>

</html>
