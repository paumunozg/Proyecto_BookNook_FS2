<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar usuario - BookNook</title>

    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/script.js" defer></script>
</head>

<body>

    <div class="admin-layout">

        <aside class="admin-sidebar">

            <div class="admin-logo">
                BookNook
                <span>Administración</span>
            </div>

            <nav class="admin-menu">

                <a href="index.html">
                    Inicio
                </a>

                <a href="productos.html">
                    Productos
                </a>

                <a href="usuarios.html" class="activo">
                    Usuarios
                </a>

                <a href="#">
                    Órdenes
                </a>

                <a href="../index.html">
                    Ver tienda
                </a>

            </nav>

            <div class="admin-salir">

                <a href="../pages/login.html">
                    Cerrar sesión
                </a>

            </div>

        </aside>


        <main class="admin-contenido">

            <div class="admin-header">

                <p class="subtitulo">
                    ADMINISTRACIÓN
                </p>

                <h1>Editar usuario</h1>

                <p>
                    Modifica los datos del usuario seleccionado.
                </p>

            </div>


            <section class="formulario-admin">

                <form
                    id="formEditarUsuario"
                    novalidate>


                    <div class="formulario-grid">


                       
                        <div class="campo">

                            <label for="editarRun">
                                RUN *
                            </label>

                            <input
                                type="text"
                                id="editarRun"
                                value="19011022K"
                                maxlength="9"
                                required>

                        </div>


                        
                        <div class="campo">

                            <label for="editarNombreUsuario">
                                Nombre *
                            </label>

                            <input
                                type="text"
                                id="editarNombreUsuario"
                                value="Paula"
                                maxlength="50"
                                required>

                        </div>


                        
                        <div class="campo">

                            <label for="editarApellidosUsuario">
                                Apellidos *
                            </label>

                            <input
                                type="text"
                                id="editarApellidosUsuario"
                                value="Muñoz"
                                maxlength="100"
                                required>

                        </div>


                       
                        <div class="campo">

                            <label for="editarCorreoUsuario">
                                Correo *
                            </label>

                            <input
                                type="email"
                                id="editarCorreoUsuario"
                                value="paula@gmail.com"
                                maxlength="100"
                                required>

                        </div>


                        
                        <div class="campo">

                            <label for="editarNacimiento">
                                Fecha de nacimiento
                            </label>

                            <input
                                type="date"
                                id="editarNacimiento"
                                value="1994-01-15">

                        </div>


                    
                        <div class="campo">

                            <label for="editarTipoUsuario">
                                Tipo de usuario *
                            </label>

                            <select
                                id="editarTipoUsuario"
                                required>

                                <option value="Administrador" selected>
                                    Administrador
                                </option>

                                <option value="Cliente">
                                    Cliente
                                </option>

                                <option value="Vendedor">
                                    Vendedor
                                </option>

                            </select>

                        </div>


                        
                        <div class="campo">

                            <label for="editarRegion">
                                Región *
                            </label>

                            <select
                                id="editarRegion"
                                required>

                                <option value="">
                                    Selecciona una región
                                </option>

                            </select>

                        </div>


                        
                        <div class="campo">

                            <label for="editarComuna">
                                Comuna *
                            </label>

                            <select
                                id="editarComuna"
                                required>

                                <option value="">
                                    Selecciona una comuna
                                </option>

                            </select>

                        </div>

                    </div>


                
                    <div class="campo">

                        <label for="editarDireccion">
                            Dirección *
                        </label>

                        <textarea
                            id="editarDireccion"
                            maxlength="300"
                            rows="4"
                            required>Av. BookNook 123, Santiago</textarea>

                    </div>


                    <div class="formulario-botones">

                        <a
                            href="usuarios.html"
                            class="btn-secundario">
                            Cancelar
                        </a>

                        <button
                            type="submit"
                            class="btn-principal">
                            Guardar cambios
                        </button>

                    </div>


                    <p
                        id="mensajeEditarUsuario"
                        class="mensaje-formulario">
                    </p>

                </form>

            </section>

        </main>

    </div>

</body>

</html>
